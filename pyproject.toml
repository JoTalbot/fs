[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-overlay"
version = "0.1.0"
description = "User-controlled, failure-tolerant filesystem overlay storage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
crypto = ["cryptography>=44"]

[project.scripts]
fs-overlay = "fs_overlay.cli:main"

[tool.pytest.ini_options]
addopts = "-q -m 'not crypto_provider'"
pythonpath = ["src"]
markers = [
  "crypto_provider: candidate production AEAD provider qualification tests; requires the crypto extra",
]
