[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-overlay"
version = "0.1.0"
description = "User-controlled, failure-tolerant filesystem overlay storage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fs-overlay = "fs_overlay.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
