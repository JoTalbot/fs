blockers:
  - id: B-01
    type: human
    summary: "release-provenance.yml cannot be dispatched from the connected GitHub integration"
    detail: >-
      `gh workflow run release-provenance.yml --repo JoTalbot/fs --ref main`
      returned HTTP 403 "Resource not accessible by integration" against
      /actions/workflows/360042142/dispatches. The gate needs a maintainer with
      Actions write access, or a `v*` tag pushed by an identity that may trigger
      workflows. Tracked by issues #15 and #16.
  - id: B-02
    type: human
    summary: "Production security qualification requires external audit evidence"
    detail: >-
      An audited AEAD provider, a qualified secure key store and an
      authenticated transport adapter cannot be produced by repository work
      alone; they require external review and deployment qualification.

