name: Release provenance

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-attest:
    name: Build, SBOM and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install isolated build tooling
        run: python -m pip install --disable-pip-version-check 'build==1.3.0' 'cyclonedx-bom==7.3.1'

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Generate SHA-256 release manifest
        shell: bash
        run: sha256sum dist/* | sort > dist/SHA256SUMS

      - name: Create isolated target environment for SBOM
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --disable-pip-version-check .
          cyclonedx-py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file dist/fs-sbom.cdx.json \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --validate

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-release-evidence
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.whl'

      - name: Attest source distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.whl'
          sbom-path: 'dist/fs-sbom.cdx.json'
